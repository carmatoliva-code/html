<!--
la etiqueta <style> se utiliza para definir estilos CSS directamente en un documento HTML. 
Esto permite controlar la apariencia y el diseño de los elementos del documento, como colores, 
fuentes, márgenes y padding.
-->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <!-- define los estilos interno al documento -->
    <style>
      div {
        background-color: red;
        padding: 20px;
        border-radius: 5px;
      }
      h1 {
        color: blue;
      }
    </style>
    <!--
    #atributos
    - type: Especifica el tipo de contenido del estilo, en este caso "text/css".
    - media: Define el tipo de medio al que se aplica el estilo, como "screen" o "print".
    - scoped: Indica que los estilos definidos en la etiqueta <style> solo se aplican al elemento padre y sus descendientes.
    - title: Proporciona un título para el bloque de estilos, que puede ser útil para la documentación o la organización del código.    
    - lang: Especifica el lenguaje del contenido dentro de la etiqueta <style>, como "en" para inglés o "es" para español.
    -dir: Define la dirección del texto dentro de la etiqueta <style>, como "ltr" (de izquierda a derecha) o "rtl" (de derecha a izquierda).
    #e.j.
    
    -->
  </head>
  <body>
    <h1>Bienvenido a mi sitio web</h1>
    <div>
      <a href="home">Home</a>
      <a href="contact">Contact</a>
      <a href="about">About</a>
    </div>
  </body>
</html>
